name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [claude/design-doc-review-7udzub, main]
  # Lets you redeploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Read the repo, write the Pages artifact, mint the deploy token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. In-flight runs finish rather than being cancelled,
# so a half-published site is not left behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        # Best-effort. This step tries to switch Pages on, which the workflow
        # token is often not permitted to do, and nothing below needs its
        # output. Letting it fail the job would mean no build and no artifact
        # over a setting that is flipped once by hand — so it does not block.
        continue-on-error: true
        with:
          enablement: true

      - name: Build static export
        # A project site is served from /<repo>, not the domain root, so the app
        # has to be built knowing its own sub-path. Derived from the repository
        # name rather than taken from the step above, so the build still
        # produces a correct artifact when Pages has not been enabled yet and
        # `configure-pages` could not report a base path. Never hard-coded, so
        # renaming the repository does not silently break every asset URL.
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Disable Jekyll
        # Without this, Pages' Jekyll pass drops every path starting with an
        # underscore — which is all of Next's `_next/` bundle.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
